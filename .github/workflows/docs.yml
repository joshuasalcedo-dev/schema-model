# The documentation site (pretty-docs) on GitHub Pages, on every push to main.
name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # prefixes=false: Central's list of known groups (/.meta/prefixes.txt) lags new groups such as pretty-docs'
      - run: mvn -B -ntp -Daether.remoteRepositoryFilter.prefixes=false compile io.joshuasalcedo.pretty:pretty-docs-maven-plugin:1.3.0:generate
      - uses: actions/upload-pages-artifact@v3
        with:
          path: target/pretty-docs
      - id: deploy
        uses: actions/deploy-pages@v4
